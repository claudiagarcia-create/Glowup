<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glow Up · Control de Inventario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #f0fdfa 0%, #faf5ff 50%, #f8fafc 100%);
      min-height: 100vh;
    }
    .loader {
      border-top-color: #9333ea;
      border-right-color: #14b8a6;
      animation: spinner 0.8s linear infinite;
    }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .glow-gradient {
      background: linear-gradient(135deg, #0d9488 0%, #9333ea 100%);
    }
    .glow-gradient-soft {
      background: linear-gradient(135deg, rgba(20, 184, 166, 0.12) 0%, rgba(168, 85, 247, 0.12) 100%);
    }
  </style>
</head>
<body class="text-slate-800 p-3.5 md:p-6">

  <div class="max-w-5xl mx-auto">
    <!-- Cabecera con Logo y Total de Unidades -->
    <div class="bg-white/90 backdrop-blur-md p-4 md:p-5 rounded-2xl border border-purple-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3.5 mb-5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img 
            src="https://i.ibb.co/93V1rXQD/logo.png" 
            onerror="this.style.display='none';"
            alt="Glow Up Logo" 
            class="h-11 w-11 md:h-14 md:w-14 object-contain rounded-xl bg-gradient-to-br from-teal-50 to-purple-50 p-1 border border-teal-100 shadow-2xs"
          >
          <div>
            <h1 class="text-lg md:text-2xl font-extrabold bg-gradient-to-r from-teal-600 via-purple-600 to-fuchsia-600 bg-clip-text text-transparent">
              Glow Up · Inventario
            </h1>
            <p class="text-xs md:text-sm text-slate-500 font-medium">Catálogo visual sincronizado</p>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between md:justify-end gap-2.5 pt-2 md:pt-0 border-t md:border-t-0 border-slate-100">
        <!-- Tarjeta única: Total Unidades -->
        <div class="glow-gradient-soft border border-purple-200/70 px-3.5 py-1.5 rounded-xl flex items-center gap-2.5">
          <div>
            <div class="text-[10px] font-bold uppercase tracking-wider text-purple-700">Total Unidades</div>
            <div id="stat-total" class="text-xl md:text-2xl font-extrabold text-teal-700 leading-none mt-0.5">0</div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="loadData()" title="Actualizar datos" class="px-3 py-2.5 bg-white border border-teal-200 rounded-xl text-sm font-semibold text-teal-700 hover:bg-teal-50 transition flex items-center gap-1.5 shadow-2xs">
            <span>↻</span> <span class="hidden sm:inline">Actualizar</span>
          </button>
          <button onclick="openModal()" class="px-4 py-2.5 glow-gradient text-white rounded-xl text-sm font-semibold hover:opacity-95 transition shadow-sm">
            + Agregar
          </button>
        </div>
      </div>
    </div>

    <!-- Pestañas rápidas por Categoría + Selector de Vista -->
    <div class="mb-4">
      <div class="flex items-center justify-between gap-2 mb-2 px-1">
        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Categorías</span>
        
        <!-- Interruptor Vista General vs Vista Detallada -->
        <div class="inline-flex items-center bg-white/90 p-1 rounded-xl border border-purple-100 shadow-2xs" role="group" aria-label="Modo de vista">
          <button 
            id="btn-view-grouped" 
            onclick="setViewMode('grouped')" 
            class="px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1.5 glow-gradient text-white shadow-2xs"
            title="Vista general agrupada por modelo"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>General</span>
          </button>
          <button 
            id="btn-view-detailed" 
            onclick="setViewMode('detailed')" 
            class="px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-600 hover:text-purple-700"
            title="Vista detallada ítem por ítem"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg>
            <span>Detallada</span>
          </button>
        </div>
      </div>

      <div id="category-tabs" class="flex flex-wrap gap-1.5 md:gap-2"></div>
    </div>

    <!-- Barra de filtros secundarios + Rango de Precio + Botón Limpiar -->
    <div class="bg-white/90 backdrop-blur-md p-3 md:p-3.5 rounded-2xl border border-teal-100 shadow-sm mb-5">
      <div class="grid grid-cols-2 lg:grid-cols-12 gap-2 items-center">
        <div class="col-span-2 lg:col-span-3">
          <input type="text" id="search-input" oninput="handleFilterChange()" placeholder="Buscar modelo o prenda..." class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-purple-400 bg-slate-50/50">
        </div>
        <div class="col-span-1 lg:col-span-2">
          <select id="filter-price" onchange="handleFilterChange()" class="w-full px-2.5 py-2 border border-slate-200 rounded-xl text-xs md:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-purple-400">
            <option value="">Precio: Todos</option>
          </select>
        </div>
        <div class="col-span-1 lg:col-span-2">
          <select id="filter-color" onchange="handleFilterChange()" class="w-full px-2.5 py-2 border border-slate-200 rounded-xl text-xs md:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-400">
            <option value="">Color: Todos</option>
          </select>
        </div>
        <div class="col-span-1 lg:col-span-2">
          <select id="filter-talla" onchange="handleFilterChange()" class="w-full px-2.5 py-2 border border-slate-200 rounded-xl text-xs md:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-400">
            <option value="">Talla: Todas</option>
          </select>
        </div>
        <div class="col-span-1 lg:col-span-3 flex items-center gap-1.5">
          <select id="filter-status" onchange="handleFilterChange()" class="w-full px-2.5 py-2 border border-slate-200 rounded-xl text-xs md:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-400">
            <option value="">Stock: Todos</option>
            <option value="ok">Disponible (> 0)</option>
            <option value="low">Pocas (1-5)</option>
            <option value="out">Agotado (0)</option>
          </select>
          <button 
            id="clear-filters-btn" 
            onclick="clearAllFilters()" 
            class="hidden shrink-0 px-2.5 py-2 rounded-xl text-xs font-bold bg-purple-100 text-purple-700 hover:bg-purple-200 border border-purple-200 transition flex items-center gap-1"
            title="Quitar todos los filtros"
          >
            ✕ <span class="hidden sm:inline">Limpiar</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Cargando -->
    <div id="loading" class="flex justify-center items-center py-14">
      <div class="loader ease-linear rounded-full border-4 border-slate-200 h-10 w-10"></div>
      <span class="ml-3 text-sm font-semibold text-purple-700">Sincronizando inventario Glow Up...</span>
    </div>

    <!-- Contenedor Principal de Resultados -->
    <div id="results-wrapper" class="hidden">
      <!-- Vista 1: Agrupada por Modelo (Vista General) -->
      <div id="grouped-view" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

      <!-- Vista 2: Individual (Vista Detallada) -->
      <div id="individual-view" class="hidden">
        <!-- Móvil: Tarjetas individuales -->
        <div id="mobile-individual-cards" class="md:hidden space-y-3"></div>
        <!-- Escritorio: Tabla individual -->
        <div class="hidden md:block bg-white rounded-2xl border border-purple-100 shadow-sm overflow-hidden">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gradient-to-r from-teal-50/80 to-purple-50/80 border-b border-purple-100 text-xs font-bold text-slate-600 uppercase tracking-wider">
                <th class="py-3.5 px-4 w-16">Foto</th>
                <th class="py-3.5 px-4">Ítem</th>
                <th class="py-3.5 px-4">Precio</th>
                <th class="py-3.5 px-4">Color</th>
                <th class="py-3.5 px-4">Talla</th>
                <th class="py-3.5 px-4 text-center">Cantidad</th>
                <th class="py-3.5 px-4 text-right">Acciones</th>
              </tr>
            </thead>
            <tbody id="inventory-body" class="divide-y divide-slate-100 text-sm"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Agregar / Editar -->
  <div id="modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-purple-100 max-h-[92vh] overflow-y-auto">
      <h2 id="modal-title" class="text-lg font-extrabold text-slate-900 mb-4">Agregar Producto</h2>
      <form id="product-form" onsubmit="handleSave(event)" class="space-y-4">
        <input type="hidden" id="prod-id">
        
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Categoría</label>
          <input type="text" id="prod-cat" list="cat-list" required placeholder="Ej. Bra Deportivo Alto impacto" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-purple-400 focus:outline-none">
          <datalist id="cat-list"></datalist>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Ítem / Modelo</label>
          <input type="text" id="prod-item" list="item-list" required placeholder="Ej. Bra Alto impacto" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-purple-400 focus:outline-none">
          <datalist id="item-list"></datalist>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Color</label>
            <input type="text" id="prod-color" list="color-list" required placeholder="Ej. Aquamarine" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-teal-400 focus:outline-none">
            <datalist id="color-list"></datalist>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Talla</label>
            <input type="text" id="prod-talla" required placeholder="Ej. M" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-teal-400 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Precio ($)</label>
            <input type="number" id="prod-price" min="0" step="0.01" required placeholder="0.00" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-purple-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Cantidad</label>
            <input type="number" id="prod-qty" min="0" required value="1" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-teal-400 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">URL de Foto (Opcional)</label>
          <input type="url" id="prod-img" placeholder="https://i.postimg.cc/..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-teal-400 focus:outline-none">
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">Cancelar</button>
          <button type="submit" id="save-btn" class="px-5 py-2 text-sm font-semibold glow-gradient text-white hover:opacity-95 rounded-xl">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Vista Previa de Foto -->
  <div id="img-modal" onclick="this.classList.add('hidden')" class="hidden fixed inset-0 bg-slate-900/75 backdrop-blur-xs flex items-center justify-center p-4 z-50 cursor-pointer">
    <div class="bg-white p-3 rounded-2xl max-w-lg w-full shadow-2xl border border-purple-100" onclick="event.stopPropagation()">
      <img id="preview-img" src="" alt="Vista previa" class="w-full h-auto max-h-[75vh] object-contain rounded-xl bg-slate-50">
      <div class="flex justify-between items-center pt-3 px-1">
        <span id="preview-title" class="text-sm font-bold text-slate-800"></span>
        <button onclick="document.getElementById('img-modal').classList.add('hidden')" class="px-3 py-1 rounded-lg bg-purple-50 text-xs font-bold text-purple-700 hover:bg-purple-100">Cerrar ✕</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyR4yMqNIjj_25Dv2tgylrxGBd3km1fzviXMB_T6u7eC6SaRPzR2YYjp1fdllSsVHnI/exec';

    let inventory = [];
    let selectedCategory = '';
    let selectedColorByGroup = {};
    let viewMode = 'grouped'; // 'grouped' (General) | 'detailed' (Detallada)

    window.onload = loadData;

    function updateViewToggleUI() {
      const btnGrouped = document.getElementById('btn-view-grouped');
      const btnDetailed = document.getElementById('btn-view-detailed');
      const activeClasses = ['glow-gradient', 'text-white', 'shadow-2xs'];
      const inactiveClasses = ['text-slate-600', 'hover:text-purple-700'];

      if (viewMode === 'grouped') {
        btnGrouped.classList.add(...activeClasses);
        btnGrouped.classList.remove(...inactiveClasses);
        btnDetailed.classList.remove(...activeClasses);
        btnDetailed.classList.add(...inactiveClasses);
      } else {
        btnDetailed.classList.add(...activeClasses);
        btnDetailed.classList.remove(...inactiveClasses);
        btnGrouped.classList.remove(...activeClasses);
        btnGrouped.classList.add(...inactiveClasses);
      }
    }

    function setViewMode(mode) {
      viewMode = mode;
      updateViewToggleUI();
      renderResults();
    }

    function getColorSwatchStyle(colorName) {
      const c = (colorName || '').toLowerCase().trim();
      const map = {
        'negro': '#18181b',
        'blanco': '#ffffff',
        'azul': '#2563eb',
        'azul claro': '#7dd3fc',
        'celeste': '#7dd3fc',
        'azul marino': '#1e3a8a',
        'marron': '#78350f',
        'marrón': '#78350f',
        'cafe': '#78350f',
        'café': '#78350f',
        'verde oliva': '#556b2f',
        'oliva': '#556b2f',
        'verde': '#16a34a',
        'aquamarine': '#2dd4bf',
        'aguamarina': '#2dd4bf',
        'turquesa': '#14b8a6',
        'rojo': '#dc2626',
        'vino': '#881337',
        'rosa': '#f472b6',
        'rosado': '#f472b6',
        'fucsia': '#d946ef',
        'morado': '#7e22ce',
        'lila': '#c084fc',
        'lavanda': '#d8b4fe',
        'gris': '#9ca3af',
        'beige': '#e7d5b8',
        'nude': '#e5c1a1',
        'amarillo': '#facc15',
        'naranja': '#f97316',
        'blanco/negro': 'linear-gradient(135deg, #ffffff 50%, #18181b 50%)',
        'puntos': 'radial-gradient(#18181b 28%, #f1f5f9 32%)',
        'colores varios': 'conic-gradient(#14b8a6, #a855f7, #f43f5e, #facc15, #14b8a6)'
      };
      return map[c] || '#cbd5e1';
    }

    function renderColorDot(colorName, isOnDark = false) {
      const bg = getColorSwatchStyle(colorName);
      const borderClass = isOnDark ? 'border-white/80' : 'border-slate-300';
      return `<span class="inline-block w-3 h-3 rounded-full border ${borderClass} shrink-0 shadow-2xs" style="background: ${bg};"></span>`;
    }

    function setLoading(isLoading) {
      document.getElementById('loading').classList.toggle('hidden', !isLoading);
      document.getElementById('results-wrapper').classList.toggle('hidden', isLoading);
    }

    async function loadData() {
      setLoading(true);
      try {
        const res = await fetch(API_URL);
        const json = await res.json();
        if (json.status === 'ok') {
          inventory = json.data || [];
          updateFilters();
          renderResults();
        } else {
          alert('Error: ' + json.message);
        }
      } catch (err) {
        alert('Error de conexión: ' + err.message);
      }
      setLoading(false);
    }

    async function sendAction(payload) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.status === 'ok') {
          inventory = json.data || [];
          updateFilters();
          renderResults();
        } else {
          alert('Error al guardar: ' + json.message);
        }
      } catch (err) {
        alert('Error de red al guardar: ' + err.message);
      }
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      // Al filtrar categoría pasa a detallada; al volver a "Todas" regresa a general
      viewMode = cat !== '' ? 'detailed' : 'grouped';
      updateViewToggleUI();
      renderCategoryTabs();
      handleFilterChange();
    }

    function handleFilterChange() {
      updateClearButtonVisibility();
      renderResults();
    }

    function updateClearButtonVisibility() {
      const hasSearch = document.getElementById('search-input').value.trim() !== '';
      const hasCat = selectedCategory !== '';
      const hasPrice = document.getElementById('filter-price').value !== '';
      const hasColor = document.getElementById('filter-color').value !== '';
      const hasTalla = document.getElementById('filter-talla').value !== '';
      const hasStatus = document.getElementById('filter-status').value !== '';

      const isAnyActive = hasSearch || hasCat || hasPrice || hasColor || hasTalla || hasStatus;
      document.getElementById('clear-filters-btn').classList.toggle('hidden', !isAnyActive);
    }

    function clearAllFilters() {
      selectedCategory = '';
      viewMode = 'grouped';
      updateViewToggleUI();
      document.getElementById('search-input').value = '';
      document.getElementById('filter-price').value = '';
      document.getElementById('filter-color').value = '';
      document.getElementById('filter-talla').value = '';
      document.getElementById('filter-status').value = '';
      renderCategoryTabs();
      updateClearButtonVisibility();
      renderResults();
    }

    function renderCategoryTabs() {
      const cats = [...new Set(inventory.map(i => i.categoria))].sort();
      const container = document.getElementById('category-tabs');
      
      const uniqueItemsAll = new Set(inventory.map(i => `${i.categoria}::${i.item}`)).size;
      const allActive = selectedCategory === '' 
        ? 'glow-gradient text-white shadow-sm border-transparent' 
        : 'bg-white text-slate-600 border border-teal-200/80 hover:border-purple-300 hover:bg-purple-50/40';
      
      let html = `<button onclick="selectCategory('')" class="px-3 py-1.5 rounded-full text-xs font-bold transition ${allActive}">Todas (${uniqueItemsAll})</button>`;
      
      cats.forEach(c => {
        const countVariants = inventory.filter(i => i.categoria === c).length;
        const active = selectedCategory === c 
          ? 'glow-gradient text-white shadow-sm border-transparent' 
          : 'bg-white text-slate-600 border border-teal-200/80 hover:border-purple-300 hover:bg-purple-50/40';
        html += `<button onclick="selectCategory('${c.replace(/'/g, "\\'")}')" class="px-3 py-1.5 rounded-full text-xs font-bold transition ${active}">${c} (${countVariants})</button>`;
      });
      
      container.innerHTML = html;
    }

    function updatePriceRanges() {
      const el = document.getElementById('filter-price');
      const current = el.value;
      const maxPrice = inventory.reduce((max, i) => Math.max(max, Number(i.precio) || 0), 0);
      const topLimit = Math.max(50, Math.ceil((maxPrice + 1) / 10) * 10);

      let optionsHtml = `<option value="">Precio: Todos</option>`;
      for (let min = 0; min < topLimit; min += 10) {
        const max = min + 10;
        optionsHtml += `<option value="${min}-${max}">$${min} a $${max}</option>`;
      }
      el.innerHTML = optionsHtml;
      el.value = current;
    }

    function updateFilters() {
      const cats = [...new Set(inventory.map(i => i.categoria))].sort();
      const colors = [...new Set(inventory.map(i => i.color))].sort();
      const tallas = [...new Set(inventory.map(i => i.talla))].sort();
      const items = [...new Set(inventory.map(i => i.item))].sort();

      renderCategoryTabs();
      updatePriceRanges();
      fillSelect('filter-color', colors, 'Color: Todos');
      fillSelect('filter-talla', tallas, 'Talla: Todas');

      fillDatalist('cat-list', cats);
      fillDatalist('item-list', items);
      fillDatalist('color-list', colors);
      updateClearButtonVisibility();
    }

    function fillSelect(id, options, defaultText) {
      const el = document.getElementById(id);
      const current = el.value;
      el.innerHTML = `<option value="">${defaultText}</option>` + 
        options.map(o => `<option value="${o}">${o}</option>`).join('');
      el.value = current;
    }

    function fillDatalist(id, options) {
      document.getElementById(id).innerHTML = options.map(o => `<option value="${o}">`).join('');
    }

    function showImage(url, title) {
      if (!url) return;
      document.getElementById('preview-img').src = url;
      document.getElementById('preview-title').textContent = title;
      document.getElementById('img-modal').classList.remove('hidden');
    }

    function formatPrice(val) {
      const num = Number(val) || 0;
      return '$' + num.toFixed(2);
    }

    function selectGroupColor(groupKey, color) {
      selectedColorByGroup[groupKey] = color;
      renderResults();
    }

    function renderResults() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const fPrice = document.getElementById('filter-price').value;
      const fColor = document.getElementById('filter-color').value;
      const fTalla = document.getElementById('filter-talla').value;
      const fStatus = document.getElementById('filter-status').value;

      const filtered = inventory.filter(p => {
        const priceNum = Number(p.precio) || 0;
        const matchSearch = p.item.toLowerCase().includes(search) || p.categoria.toLowerCase().includes(search);
        const matchCat = !selectedCategory || p.categoria === selectedCategory;
        const matchColor = !fColor || p.color === fColor;
        const matchTalla = !fTalla || p.talla === fTalla;

        let matchPrice = true;
        if (fPrice) {
          const [minP, maxP] = fPrice.split('-').map(Number);
          matchPrice = priceNum >= minP && priceNum <= maxP;
        }

        let matchStatus = true;
        if (fStatus === 'ok') matchStatus = p.cantidad > 0;
        if (fStatus === 'low') matchStatus = p.cantidad > 0 && p.cantidad <= 5;
        if (fStatus === 'out') matchStatus = p.cantidad === 0;

        return matchSearch && matchCat && matchPrice && matchColor && matchTalla && matchStatus;
      });

      document.getElementById('stat-total').textContent = filtered.reduce((acc, i) => acc + i.cantidad, 0);

      const groupedEl = document.getElementById('grouped-view');
      const individualEl = document.getElementById('individual-view');

      if (viewMode === 'detailed') {
        groupedEl.classList.add('hidden');
        individualEl.classList.remove('hidden');
        renderIndividualView(filtered);
      } else {
        individualEl.classList.add('hidden');
        groupedEl.classList.remove('hidden');
        renderGroupedView(filtered);
      }
    }

    // VISTA 1: General Agrupada por Modelo
    function renderGroupedView(filtered) {
      const container = document.getElementById('grouped-view');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full bg-white rounded-2xl border border-purple-100 p-10 text-center text-sm text-slate-500">No se encontraron prendas con esos filtros.</div>`;
        return;
      }

      const groupsMap = new Map();
      filtered.forEach(p => {
        const key = `${p.categoria}|||${p.item}`;
        if (!groupsMap.has(key)) {
          groupsMap.set(key, {
            key: key,
            categoria: p.categoria,
            item: p.item,
            variants: []
          });
        }
        groupsMap.get(key).variants.push(p);
      });

      const sizeOrder = { 'XS': 1, 'S': 2, 'M': 3, 'L': 4, 'XL': 5, 'XXL': 6, 'Única': 7 };

      container.innerHTML = Array.from(groupsMap.values()).map(group => {
        const colors = [...new Set(group.variants.map(v => v.color))];
        
        let activeColor = selectedColorByGroup[group.key];
        if (!activeColor || !colors.includes(activeColor)) {
          activeColor = colors[0];
          selectedColorByGroup[group.key] = activeColor;
        }

        const colorVariants = group.variants
          .filter(v => v.color === activeColor)
          .sort((a, b) => (sizeOrder[a.talla] || 99) - (sizeOrder[b.talla] || 99));

        const activeImg = (colorVariants.find(v => v.imagen) || group.variants.find(v => v.imagen) || {}).imagen || '';

        const prices = [...new Set(colorVariants.map(v => Number(v.precio) || 0))];
        const priceDisplay = prices.length === 1 
          ? formatPrice(prices[0]) 
          : `${formatPrice(Math.min(...prices))} - ${formatPrice(Math.max(...prices))}`;

        const totalModelUnits = group.variants.reduce((sum, v) => sum + v.cantidad, 0);

        const imgHtml = activeImg
          ? `<img src="${activeImg}" onclick="showImage('${activeImg}', '${group.item} · ${activeColor}')" class="w-20 h-20 shrink-0 object-cover rounded-2xl border border-teal-100 cursor-pointer hover:scale-105 transition shadow-xs" onerror="this.src='https://placehold.co/120x120/f0fdfa/0d9488?text=Sin+Foto'">`
          : `<div class="w-20 h-20 shrink-0 rounded-2xl bg-gradient-to-br from-teal-50 to-purple-50 border border-purple-100 flex items-center justify-center text-purple-300 text-xs font-semibold text-center leading-tight">Sin<br>foto</div>`;

        const colorPillsHtml = colors.map(c => {
          const isSelected = c === activeColor;
          const colorStock = group.variants.filter(v => v.color === c).reduce((s, v) => s + v.cantidad, 0);
          const pillStyle = isSelected
            ? 'glow-gradient text-white shadow-xs border-transparent'
            : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-purple-300 hover:bg-purple-50/50';
          const escapedKey = group.key.replace(/'/g, "\\'");
          const escapedColor = c.replace(/'/g, "\\'");
          return `
            <button 
              onclick="selectGroupColor('${escapedKey}', '${escapedColor}')" 
              class="px-2.5 py-1 rounded-xl text-xs font-bold border transition flex items-center gap-1.5 ${pillStyle}"
            >
              ${renderColorDot(c, isSelected)}
              <span>${c}</span>
              <span class="text-[10px] px-1.5 py-0.2 rounded-full ${isSelected ? 'bg-white/25 text-white' : 'bg-slate-200/80 text-slate-600'}">${colorStock}</span>
            </button>
          `;
        }).join('');

        const sizesRowsHtml = colorVariants.map(v => {
          let qtyBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-teal-100 text-teal-800">${v.cantidad} unid.</span>`;
          if (v.cantidad === 0) qtyBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-700">Agotado</span>`;
          else if (v.cantidad <= 5) qtyBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-purple-100 text-purple-800">${v.cantidad} unid.</span>`;

          const variantPriceTag = prices.length > 1 
            ? `<span class="text-xs font-bold text-teal-700 ml-1.5">(${formatPrice(v.precio)})</span>` 
            : '';

          return `
            <div class="flex items-center justify-between py-2 px-2.5 rounded-xl bg-slate-50/80 hover:bg-purple-50/40 border border-slate-100 transition">
              <div class="flex items-center gap-2">
                <span class="min-w-[34px] text-center px-2 py-0.5 bg-white text-purple-700 border border-purple-200 rounded-lg text-xs font-extrabold shadow-2xs">
                  ${v.talla}
                </span>
                ${variantPriceTag}
              </div>

              <div class="flex items-center gap-1.5">
                <button onclick="changeStock('${v.id}', -1)" class="w-7 h-7 rounded-lg bg-white hover:bg-teal-50 border border-teal-200 font-bold text-teal-800 text-sm flex items-center justify-center shadow-2xs">-</button>
                <div class="min-w-[72px] text-center">${qtyBadge}</div>
                <button onclick="changeStock('${v.id}', 1)" class="w-7 h-7 rounded-lg bg-white hover:bg-purple-50 border border-purple-200 font-bold text-purple-800 text-sm flex items-center justify-center shadow-2xs">+</button>
              </div>

              <div class="flex items-center gap-2">
                <button onclick='editProduct(${JSON.stringify(v)})' title="Editar variante" class="text-[11px] font-bold text-teal-600 hover:text-teal-800 px-1.5 py-1 rounded-md hover:bg-teal-50">Editar</button>
                <button onclick="removeProduct('${v.id}')" title="Eliminar variante" class="text-[11px] font-bold text-rose-500 hover:text-rose-700 px-1.5 py-1 rounded-md hover:bg-rose-50">✕</button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="bg-white rounded-2xl border border-purple-100 p-4 shadow-xs flex flex-col justify-between">
            <div>
              <div class="flex gap-3.5 items-start">
                ${imgHtml}
                <div class="flex-1 min-w-0">
                  <div class="flex items-start justify-between gap-2">
                    <h3 class="font-extrabold text-slate-900 text-base leading-snug">${group.item}</h3>
                    <span class="shrink-0 font-extrabold text-sm text-teal-700 bg-teal-50 px-2.5 py-1 rounded-xl border border-teal-100">
                      ${priceDisplay}
                    </span>
                  </div>
                  <div class="text-xs text-slate-500 font-medium mt-1">
                    Stock total del modelo: <strong class="text-purple-700">${totalModelUnits} unid.</strong>
                  </div>

                  <div class="mt-2.5">
                    <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Colores disponibles</div>
                    <div class="flex flex-wrap gap-1.5">
                      ${colorPillsHtml}
                    </div>
                  </div>
                </div>
              </div>

              <div class="mt-3.5 pt-3 border-t border-slate-100">
                <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5 px-1">
                  <span class="flex items-center gap-1.5">Tallas en ${renderColorDot(activeColor)} ${activeColor}</span>
                  <span>Stock / Acciones</span>
                </div>
                <div class="space-y-1.5">
                  ${sizesRowsHtml}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // VISTA 2: Detallada Individual
    function renderIndividualView(filtered) {
      const tbody = document.getElementById('inventory-body');
      const mobileCards = document.getElementById('mobile-individual-cards');

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-10 text-center text-slate-500">No se encontraron prendas con esos filtros.</td></tr>`;
        mobileCards.innerHTML = `<div class="bg-white rounded-2xl border border-purple-100 p-8 text-center text-sm text-slate-500">No se encontraron prendas con esos filtros.</div>`;
        return;
      }

      // Escritorio
      tbody.innerHTML = filtered.map(p => {
        let badge = `<span class="px-3 py-0.5 rounded-full text-xs font-bold bg-teal-100 text-teal-800">${p.cantidad}</span>`;
        if (p.cantidad === 0) badge = `<span class="px-3 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-700">Agotado (0)</span>`;
        else if (p.cantidad <= 5) badge = `<span class="px-3 py-0.5 rounded-full text-xs font-bold bg-purple-100 text-purple-800">${p.cantidad} unid.</span>`;

        const imgHtml = p.imagen 
          ? `<img src="${p.imagen}" onclick="showImage('${p.imagen}', '${p.item} · ${p.color}')" class="w-11 h-11 object-cover rounded-xl border border-teal-100 cursor-pointer hover:scale-105 transition shadow-2xs" onerror="this.src='https://placehold.co/80x80/f0fdfa/0d9488?text=Sin+Foto'">`
          : `<div class="w-11 h-11 rounded-xl bg-gradient-to-br from-teal-50 to-purple-50 border border-purple-100 flex items-center justify-center text-purple-300 text-[10px] font-semibold text-center leading-tight">Sin<br>foto</div>`;

        return `
          <tr class="hover:bg-purple-50/30 transition">
            <td class="py-2.5 px-4">${imgHtml}</td>
            <td class="py-3 px-4 font-bold text-slate-800">${p.item}</td>
            <td class="py-3 px-4 font-bold text-teal-700">${formatPrice(p.precio)}</td>
            <td class="py-3 px-4 text-slate-700 font-medium">
              <span class="inline-flex items-center gap-1.5">
                ${renderColorDot(p.color)}
                <span>${p.color}</span>
              </span>
            </td>
            <td class="py-3 px-4">
              <span class="px-2.5 py-0.5 bg-purple-50 text-purple-700 border border-purple-200/70 rounded-lg text-xs font-bold">${p.talla}</span>
            </td>
            <td class="py-3 px-4">
              <div class="flex items-center justify-center gap-2">
                <button onclick="changeStock('${p.id}', -1)" class="w-7 h-7 rounded-lg bg-teal-50 hover:bg-teal-100 border border-teal-200 font-bold text-teal-800 transition">-</button>
                <div class="min-w-[76px] text-center">${badge}</div>
                <button onclick="changeStock('${p.id}', 1)" class="w-7 h-7 rounded-lg bg-purple-50 hover:bg-purple-100 border border-purple-200 font-bold text-purple-800 transition">+</button>
              </div>
            </td>
            <td class="py-3 px-4 text-right space-x-2.5">
              <button onclick='editProduct(${JSON.stringify(p)})' class="text-xs font-bold text-teal-600 hover:text-teal-800 hover:underline">Editar</button>
              <button onclick="removeProduct('${p.id}')" class="text-xs font-bold text-rose-500 hover:text-rose-700 hover:underline">Eliminar</button>
            </td>
          </tr>
        `;
      }).join('');

      // Móvil
      mobileCards.innerHTML = filtered.map(p => {
        let badge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-teal-100 text-teal-800">${p.cantidad} disp.</span>`;
        if (p.cantidad === 0) badge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-700">Agotado</span>`;
        else if (p.cantidad <= 5) badge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-purple-100 text-purple-800">${p.cantidad} unid.</span>`;

        const mobileImgHtml = p.imagen 
          ? `<img src="${p.imagen}" onclick="showImage('${p.imagen}', '${p.item} · ${p.color}')" class="w-16 h-16 shrink-0 object-cover rounded-xl border border-teal-100 cursor-pointer shadow-2xs" onerror="this.src='https://placehold.co/96x96/f0fdfa/0d9488?text=Sin+Foto'">`
          : `<div class="w-16 h-16 shrink-0 rounded-xl bg-gradient-to-br from-teal-50 to-purple-50 border border-purple-100 flex items-center justify-center text-purple-300 text-[11px] font-semibold text-center leading-tight">Sin<br>foto</div>`;

        return `
          <div class="bg-white rounded-2xl border border-purple-100/90 p-3.5 shadow-xs">
            <div class="flex gap-3 items-start">
              ${mobileImgHtml}
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                  <h3 class="font-bold text-slate-900 text-sm leading-snug">${p.item}</h3>
                  <span class="shrink-0 font-extrabold text-sm text-teal-700 bg-teal-50 px-2 py-0.5 rounded-lg border border-teal-100">${formatPrice(p.precio)}</span>
                </div>
                
                <div class="flex flex-wrap items-center gap-1.5 mt-2">
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700">
                    ${renderColorDot(p.color)}
                    <span>Color: <strong class="text-slate-900">${p.color}</strong></span>
                  </span>
                  <span class="inline-flex items-center px-2.5 py-0.5 rounded-lg text-xs font-bold bg-purple-50 text-purple-700 border border-purple-200/70">
                    Talla: ${p.talla}
                  </span>
                </div>
              </div>
            </div>

            <div class="flex items-center justify-between pt-3 mt-3 border-t border-slate-100">
              <div class="flex items-center gap-2">
                <button onclick="changeStock('${p.id}', -1)" class="w-8 h-8 rounded-xl bg-teal-50 active:bg-teal-100 border border-teal-200 font-bold text-teal-800 text-base flex items-center justify-center">-</button>
                <div class="min-w-[74px] text-center">${badge}</div>
                <button onclick="changeStock('${p.id}', 1)" class="w-8 h-8 rounded-xl bg-purple-50 active:bg-purple-100 border border-purple-200 font-bold text-purple-800 text-base flex items-center justify-center">+</button>
              </div>

              <div class="flex items-center gap-3">
                <button onclick='editProduct(${JSON.stringify(p)})' class="text-xs font-bold text-teal-600 hover:text-teal-800 px-2 py-1 rounded-lg bg-teal-50/50">Editar</button>
                <button onclick="removeProduct('${p.id}')" class="text-xs font-bold text-rose-500 hover:text-rose-700 px-2 py-1 rounded-lg bg-rose-50/50">Eliminar</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function changeStock(id, delta) {
      const item = inventory.find(i => i.id === id);
      if (item) {
        item.cantidad = Math.max(0, item.cantidad + delta);
        renderResults();
      }
      await sendAction({ action: 'updateStock', id: id, delta: delta });
    }

    function openModal() {
      document.getElementById('modal-title').textContent = 'Agregar Producto';
      document.getElementById('product-form').reset();
      document.getElementById('prod-id').value = '';
      if (selectedCategory) document.getElementById('prod-cat').value = selectedCategory;
      document.getElementById('modal').classList.remove('hidden');
    }

    function editProduct(p) {
      document.getElementById('modal-title').textContent = 'Editar Variante';
      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-cat').value = p.categoria;
      document.getElementById('prod-item').value = p.item;
      document.getElementById('prod-color').value = p.color;
      document.getElementById('prod-talla').value = p.talla;
      document.getElementById('prod-price').value = p.precio || 0;
      document.getElementById('prod-qty').value = p.cantidad;
      document.getElementById('prod-img').value = p.imagen || '';
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    async function handleSave(e) {
      e.preventDefault();
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      const product = {
        id: document.getElementById('prod-id').value,
        categoria: document.getElementById('prod-cat').value.trim(),
        item: document.getElementById('prod-item').value.trim(),
        color: document.getElementById('prod-color').value.trim(),
        talla: document.getElementById('prod-talla').value.trim(),
        precio: Number(document.getElementById('prod-price').value) || 0,
        cantidad: Number(document.getElementById('prod-qty').value),
        imagen: document.getElementById('prod-img').value.trim(),
        mode: 'add'
      };

      await sendAction({ action: 'save', product: product });
      closeModal();
      btn.disabled = false;
      btn.textContent = 'Guardar';
    }

    async function removeProduct(id) {
      if (!confirm('¿Eliminar esta variante del inventario?')) return;
      setLoading(true);
      await sendAction({ action: 'delete', id: id });
      setLoading(false);
    }
  </script>
</body>
</html>
