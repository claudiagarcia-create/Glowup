<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Inventario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .loader { border-top-color: #4f46e5; animation: spinner 0.8s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="text-slate-800 p-4 md:p-6">

  <div class="max-w-6xl mx-auto">
    <!-- Cabecera -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Control de Inventario</h1>
        <p class="text-sm text-slate-500">Catálogo visual sincronizado en tiempo real</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="loadData()" class="px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-1.5 shadow-sm">
          <span>↻</span> Actualizar
        </button>
        <button onclick="openModal()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 shadow-sm">
          + Agregar Producto
        </button>
      </div>
    </div>

    <!-- Tarjetas de resumen -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-medium text-slate-500 uppercase">Total Unidades</div>
        <div id="stat-total" class="text-2xl font-bold text-slate-900 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-medium text-slate-500 uppercase">Variantes (SKU)</div>
        <div id="stat-variants" class="text-2xl font-bold text-slate-900 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-medium text-amber-600 uppercase">Stock Bajo (≤ 5)</div>
        <div id="stat-low" class="text-2xl font-bold text-amber-600 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-medium text-rose-600 uppercase">Agotados (0)</div>
        <div id="stat-out" class="text-2xl font-bold text-rose-600 mt-1">0</div>
      </div>
    </div>

    <!-- Pestañas rápidas por Categoría -->
    <div id="category-tabs" class="flex flex-wrap gap-2 mb-4"></div>

    <!-- Barra de filtros secundarios -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
      <input type="text" id="search-input" oninput="renderTable()" placeholder="Buscar modelo o ítem..." class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <select id="filter-color" onchange="renderTable()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Todos los colores</option>
      </select>
      <select id="filter-talla" onchange="renderTable()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Todas las tallas</option>
      </select>
      <select id="filter-status" onchange="renderTable()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Todos los estados</option>
        <option value="ok">En stock (> 5)</option>
        <option value="low">Stock bajo (1-5)</option>
        <option value="out">Agotado (0)</option>
      </select>
    </div>

    <!-- Cargando -->
    <div id="loading" class="flex justify-center items-center py-12">
      <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-10 w-10"></div>
      <span class="ml-3 text-sm font-medium text-slate-600">Sincronizando inventario...</span>
    </div>

    <!-- Tabla -->
    <div id="table-container" class="hidden bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase">
            <th class="py-3 px-4 w-16">Foto</th>
            <th class="py-3 px-4">Categoría</th>
            <th class="py-3 px-4">Ítem / Modelo</th>
            <th class="py-3 px-4">Color</th>
            <th class="py-3 px-4">Talla</th>
            <th class="py-3 px-4 text-center">Cantidad</th>
            <th class="py-3 px-4 text-right">Acciones</th>
          </tr>
        </thead>
        <tbody id="inventory-body" class="divide-y divide-slate-200 text-sm"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Agregar / Editar -->
  <div id="modal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
      <h2 id="modal-title" class="text-lg font-bold text-slate-900 mb-4">Agregar Producto</h2>
      <form id="product-form" onsubmit="handleSave(event)" class="space-y-4">
        <input type="hidden" id="prod-id">
        
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Categoría</label>
          <input type="text" id="prod-cat" list="cat-list" required placeholder="Ej. Sostenes deportivos" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
          <datalist id="cat-list"></datalist>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Ítem / Modelo</label>
          <input type="text" id="prod-item" list="item-list" required placeholder="Ej. Sostén de alto impacto" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
          <datalist id="item-list"></datalist>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Color</label>
            <input type="text" id="prod-color" list="color-list" required placeholder="Ej. Negro" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <datalist id="color-list"></datalist>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Talla</label>
            <input type="text" id="prod-talla" required placeholder="Ej. M" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Cantidad</label>
            <input type="number" id="prod-qty" min="0" required value="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">URL de Foto (Opcional)</label>
            <input type="url" id="prod-img" placeholder="https://..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
          <button type="submit" id="save-btn" class="px-4 py-2 text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Vista Previa de Foto -->
  <div id="img-modal" onclick="this.classList.add('hidden')" class="hidden fixed inset-0 bg-slate-900/75 flex items-center justify-center p-4 z-50 cursor-pointer">
    <div class="bg-white p-2 rounded-2xl max-w-lg w-full shadow-2xl" onclick="event.stopPropagation()">
      <img id="preview-img" src="" alt="Vista previa" class="w-full h-auto max-h-[75vh] object-contain rounded-xl">
      <div class="flex justify-between items-center pt-2 px-2">
        <span id="preview-title" class="text-sm font-semibold text-slate-700"></span>
        <button onclick="document.getElementById('img-modal').classList.add('hidden')" class="text-xs font-medium text-slate-500 hover:text-slate-800">Cerrar ✕</button>
      </div>
    </div>
  </div>

  <script>
    // 👇 PEGA AQUÍ TU ENLACE DE APPS SCRIPT (EL QUE TERMINA EN /exec)
    const API_URL = 'PEGA_AQUI_TU_URL_EXEC';

    let inventory = [];
    let selectedCategory = '';

    window.onload = loadData;

    function setLoading(isLoading) {
      document.getElementById('loading').classList.toggle('hidden', !isLoading);
      document.getElementById('table-container').classList.toggle('hidden', isLoading);
    }

    async function loadData() {
      if (API_URL === 'https://script.google.com/macros/s/AKfycbyR4yMqNIjj_25Dv2tgylrxGBd3km1fzviXMB_T6u7eC6SaRPzR2YYjp1fdllSsVHnI/exec') {
        alert('Recuerda pegar tu enlace /exec en la variable API_URL dentro del código.');
        return;
      }
      setLoading(true);
      try {
        const res = await fetch(API_URL);
        const json = await res.json();
        if (json.status === 'ok') {
          inventory = json.data || [];
          updateFilters();
          renderTable();
        } else {
          alert('Error: ' + json.message);
        }
      } catch (err) {
        alert('Error de conexión: ' + err.message);
      }
      setLoading(false);
    }

    async function sendAction(payload) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.status === 'ok') {
          inventory = json.data || [];
          updateFilters();
          renderTable();
        } else {
          alert('Error al guardar: ' + json.message);
        }
      } catch (err) {
        alert('Error de red al guardar: ' + err.message);
      }
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategoryTabs();
      renderTable();
    }

    function renderCategoryTabs() {
      const cats = [...new Set(inventory.map(i => i.categoria))].sort();
      const container = document.getElementById('category-tabs');
      
      const allActive = selectedCategory === '' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50';
      let html = `<button onclick="selectCategory('')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition ${allActive}">Todas (${inventory.length})</button>`;
      
      cats.forEach(c => {
        const count = inventory.filter(i => i.categoria === c).length;
        const active = selectedCategory === c ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50';
        html += `<button onclick="selectCategory('${c.replace(/'/g, "\\'")}')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition ${active}">${c} (${count})</button>`;
      });
      
      container.innerHTML = html;
    }

    function updateFilters() {
      const cats = [...new Set(inventory.map(i => i.categoria))].sort();
      const colors = [...new Set(inventory.map(i => i.color))].sort();
      const tallas = [...new Set(inventory.map(i => i.talla))].sort();
      const items = [...new Set(inventory.map(i => i.item))].sort();

      renderCategoryTabs();
      fillSelect('filter-color', colors, 'Todos los colores');
      fillSelect('filter-talla', tallas, 'Todas las tallas');

      fillDatalist('cat-list', cats);
      fillDatalist('item-list', items);
      fillDatalist('color-list', colors);
    }

    function fillSelect(id, options, defaultText) {
      const el = document.getElementById(id);
      const current = el.value;
      el.innerHTML = `<option value="">${defaultText}</option>` + 
        options.map(o => `<option value="${o}">${o}</option>`).join('');
      el.value = current;
    }

    function fillDatalist(id, options) {
      document.getElementById(id).innerHTML = options.map(o => `<option value="${o}">`).join('');
    }

    function showImage(url, title) {
      if (!url) return;
      document.getElementById('preview-img').src = url;
      document.getElementById('preview-title').textContent = title;
      document.getElementById('img-modal').classList.remove('hidden');
    }

    function renderTable() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const fColor = document.getElementById('filter-color').value;
      const fTalla = document.getElementById('filter-talla').value;
      const fStatus = document.getElementById('filter-status').value;

      const filtered = inventory.filter(p => {
        const matchSearch = p.item.toLowerCase().includes(search) || p.categoria.toLowerCase().includes(search);
        const matchCat = !selectedCategory || p.categoria === selectedCategory;
        const matchColor = !fColor || p.color === fColor;
        const matchTalla = !fTalla || p.talla === fTalla;
        let matchStatus = true;
        if (fStatus === 'ok') matchStatus = p.cantidad > 5;
        if (fStatus === 'low') matchStatus = p.cantidad > 0 && p.cantidad <= 5;
        if (fStatus === 'out') matchStatus = p.cantidad === 0;
        return matchSearch && matchCat && matchColor && matchTalla && matchStatus;
      });

      document.getElementById('stat-total').textContent = filtered.reduce((acc, i) => acc + i.cantidad, 0);
      document.getElementById('stat-variants').textContent = filtered.length;
      document.getElementById('stat-low').textContent = filtered.filter(i => i.cantidad > 0 && i.cantidad <= 5).length;
      document.getElementById('stat-out').textContent = filtered.filter(i => i.cantidad === 0).length;

      const tbody = document.getElementById('inventory-body');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-500">No se encontraron productos con esos filtros.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        let badge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">${p.cantidad}</span>`;
        if (p.cantidad === 0) badge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-100 text-rose-800">Agotado (0)</span>`;
        else if (p.cantidad <= 5) badge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800">Bajo (${p.cantidad})</span>`;

        const imgHtml = p.imagen 
          ? `<img src="${p.imagen}" onclick="showImage('${p.imagen}', '${p.item} - ${p.color}')" class="w-10 h-10 object-cover rounded-lg border border-slate-200 cursor-pointer hover:opacity-80 transition" onerror="this.src='https://placehold.co/80x80/f1f5f9/94a3b8?text=Sin+Foto'">`
          : `<div class="w-10 h-10 rounded-lg bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-400 text-[10px] text-center leading-tight">Sin<br>foto</div>`;

        return `
          <tr class="hover:bg-slate-50">
            <td class="py-2.5 px-4">${imgHtml}</td>
            <td class="py-3 px-4 font-medium text-indigo-700">${p.categoria}</td>
            <td class="py-3 px-4 font-semibold text-slate-900">${p.item}</td>
            <td class="py-3 px-4 text-slate-600">${p.color}</td>
            <td class="py-3 px-4"><span class="px-2 py-0.5 bg-slate-100 border border-slate-200 rounded text-xs font-medium">${p.talla}</span></td>
            <td class="py-3 px-4">
              <div class="flex items-center justify-center gap-2">
                <button onclick="changeStock('${p.id}', -1)" class="w-7 h-7 rounded-md bg-slate-100 hover:bg-slate-200 font-bold text-slate-700">-</button>
                <div class="min-w-[70px] text-center">${badge}</div>
                <button onclick="changeStock('${p.id}', 1)" class="w-7 h-7 rounded-md bg-slate-100 hover:bg-slate-200 font-bold text-slate-700">+</button>
              </div>
            </td>
            <td class="py-3 px-4 text-right space-x-2">
              <button onclick='editProduct(${JSON.stringify(p)})' class="text-xs font-medium text-indigo-600 hover:underline">Editar</button>
              <button onclick="removeProduct('${p.id}')" class="text-xs font-medium text-rose-600 hover:underline">Eliminar</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function changeStock(id, delta) {
      const item = inventory.find(i => i.id === id);
      if (item) {
        item.cantidad = Math.max(0, item.cantidad + delta);
        renderTable();
      }
      await sendAction({ action: 'updateStock', id: id, delta: delta });
    }

    function openModal() {
      document.getElementById('modal-title').textContent = 'Agregar Producto';
      document.getElementById('product-form').reset();
      document.getElementById('prod-id').value = '';
      if (selectedCategory) document.getElementById('prod-cat').value = selectedCategory;
      document.getElementById('modal').classList.remove('hidden');
    }

    function editProduct(p) {
      document.getElementById('modal-title').textContent = 'Editar Producto';
      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-cat').value = p.categoria;
      document.getElementById('prod-item').value = p.item;
      document.getElementById('prod-color').value = p.color;
      document.getElementById('prod-talla').value = p.talla;
      document.getElementById('prod-qty').value = p.cantidad;
      document.getElementById('prod-img').value = p.imagen || '';
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    async function handleSave(e) {
      e.preventDefault();
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      const product = {
        id: document.getElementById('prod-id').value,
        categoria: document.getElementById('prod-cat').value.trim(),
        item: document.getElementById('prod-item').value.trim(),
        color: document.getElementById('prod-color').value.trim(),
        talla: document.getElementById('prod-talla').value.trim(),
        cantidad: Number(document.getElementById('prod-qty').value),
        imagen: document.getElementById('prod-img').value.trim(),
        mode: 'add'
      };

      await sendAction({ action: 'save', product: product });
      closeModal();
      btn.disabled = false;
      btn.textContent = 'Guardar';
    }

    async function removeProduct(id) {
      if (!confirm('¿Eliminar este producto del inventario?')) return;
      setLoading(true);
      await sendAction({ action: 'delete', id: id });
      setLoading(false);
    }
  </script>
</body>
</html>
